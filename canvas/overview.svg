<svg xmlns="http://www.w3.org/2000/svg" width="960" height="626" viewBox="0 0 960 626" role="img" aria-labelledby="title desc">
<title id="title">纹样工作室：四步图片流程</title>
<desc id="desc">原照片之后依次补全与透明抠图、柔光参考、白色主纹剪影、保留刻线与眼部凹陷的连续高度；仅提供目标模型或明确要求时增加 UV 遮罩匹配。</desc>
<rect width="960" height="626" rx="16" fill="#14181c"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#92b8d0"/></marker></defs>
<g font-family="Microsoft YaHei,system-ui,sans-serif">
<text x="40" y="48" fill="#e8eceb" font-size="25">纹样工作室 · 四步图片流程</text>
<text x="40" y="78" fill="#a9b3b8" font-size="14">剪影保留实体支撑 · 刻线与眼部凹陷写入连续高度</text>
<rect x="40" y="108" width="880" height="78" rx="9" fill="#232c33" stroke="#364149"/>
<text x="58" y="139" fill="#e8eceb" font-size="18">原照片</text>
<text x="58" y="164" fill="#a9b3b8" font-size="14">兽面纹局部照片 · 保留原始输入</text>
<path d="M144 186V232" fill="none" stroke="#92b8d0" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="240" width="208" height="146" rx="9" fill="#232c33" stroke="#486574"/>
<text x="54" y="268" fill="#92b8d0" font-size="12">步骤 1 · 已有结果</text>
<text x="54" y="301" fill="#e8eceb" font-size="17">1. 补全与透明抠图</text>
<text x="54" y="333" fill="#a9b3b8" font-size="13">保留可见结构</text>
<text x="54" y="355" fill="#a9b3b8" font-size="13">补足边缘</text>
<path d="M248 312H259" fill="none" stroke="#92b8d0" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="264" y="240" width="208" height="146" rx="9" fill="#232c33" stroke="#486574"/>
<text x="278" y="268" fill="#92b8d0" font-size="12">步骤 2 · 已有结果</text>
<text x="278" y="301" fill="#e8eceb" font-size="17">2. 柔光参考</text>
<text x="278" y="333" fill="#a9b3b8" font-size="13">减弱反光与偏色</text>
<text x="278" y="355" fill="#a9b3b8" font-size="13">保留读形</text>
<path d="M472 312H483" fill="none" stroke="#92b8d0" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="488" y="240" width="208" height="146" rx="9" fill="#232c33" stroke="#486574"/>
<text x="502" y="268" fill="#92b8d0" font-size="12">步骤 3 · 已有结果</text>
<text x="502" y="301" fill="#e8eceb" font-size="17">3. 主纹剪影</text>
<text x="502" y="333" fill="#a9b3b8" font-size="13">白色装饰实体</text>
<text x="502" y="355" fill="#a9b3b8" font-size="13">凹陷仍保留支撑</text>
<path d="M696 312H707" fill="none" stroke="#92b8d0" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="712" y="240" width="208" height="146" rx="9" fill="#232c33" stroke="#486574"/>
<text x="726" y="268" fill="#92b8d0" font-size="12">步骤 4 · 已有结果</text>
<text x="726" y="301" fill="#e8eceb" font-size="17">4. 连续高度</text>
<text x="726" y="333" fill="#a9b3b8" font-size="13">细刻线与眼部凹陷</text>
<text x="726" y="355" fill="#a9b3b8" font-size="13">连续坡度</text>
<path d="M816 386V447" fill="none" stroke="#d4b18c" stroke-dasharray="6 5" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="421" fill="#a9b3b8" font-size="14">默认在步骤 4 交付；补全及高度是艺术重建，不是测量深度。</text>
<rect x="40" y="456" width="880" height="107" rx="9" fill="#232c33" stroke="#d4b18c" stroke-dasharray="6 5"/>
<text x="58" y="488" fill="#e8eceb" font-size="18">5. UV 遮罩匹配（条件步骤）</text>
<text x="58" y="518" fill="#d4b18c" font-size="14">提供目标模型或明确要求后开启</text>
<text x="58" y="545" fill="#a9b3b8" font-size="13">核实模型与 UV · 保持剪影和高度对齐 · 默认不重复铺排</text>
<text x="40" y="598" fill="#a9b3b8" font-size="13">原照片、四步结果和提示词均保留，每次新生成另存版本。</text>
</g></svg>
