"Rodin / Hyper3D 的独立生成路线","category":"future","status":"待验收","scope":"future","x":1398,"y":58,"width":224,"height":140,"input":"分部件参考与结构说明","output":"需检查的完整 3D 模型","rules":["当前浮雕路线不依赖 Rodin。","生成质量、遮挡结构、拓扑与 UV 需单独验证。","API / OAuth 在对应执行环境授权，凭证不写进画布或 Git。"]},{"id":"future-uv","title":"指定 UV 内生成纹样","summary":"输入 UV 材料区域并约束布局","category":"future","status":"待验收","scope":"future","x":1398,"y":246,"width":224,"height":140,"input":"UV 遮罩 + 纹样照片","output":"UV 内的材料遮罩与高度","rules":["当前案例未提供 UV 模板，此分支尚未验收。","需检查跨岛对齐、边缘留白与接缝连续性。"]},{"id":"future-pbr","title":"PBR / Substance Painter","summary":"材质通道、烘焙与模板导出","category":"future","status":"待验收","scope":"future","x":1398,"y":434,"width":224,"height":140,"input":"模型、UV、材质参考","output":"需验证的 PBR 通道与 Painter 工程","rules":["整模型贴图和自动导入尚未固化。","不能把去光照参考当作已完成 PBR 材质。"]},{"id":"future-md","title":"MD 工业纸样 / 布料","summary":"可裁剪缝制纸样与真实模拟","category":"future","status":"暂缓","scope":"future","x":1398,"y":622,"width":224,"height":140,"input":"服装设计、人体与工艺","output":"工业纸样与 MD 布料模拟","rules":["用户已暂缓该路线，尚未实现与验收。","图片褶皱编辑不能代替真实布料模拟。"]},{"id":"future-hair","title":"毛发插片贴图 / Mesh","summary":"毛束通道与插片布局","category":"future","status":"待验收","scope":"future","x":1398,"y":810,"width":224,"height":140,"input":"毛发参考、目标预算","output":"插片贴图与插片 Mesh","rules":["尚未固化，需单独定义透明、法线、颜色等通道与 Mesh 验收。"]}],"edges":[{"id":"e01","fromNode":"photo","fromSide":"right","toNode":"cutout","toSide":"left"},{"id":"e02","fromNode":"cutout","fromSide":"right","toNode":"delight","toSide":"left"},{"id":"e03","fromNode":"delight","fromSide":"right","toNode":"mask","toSide":"left"},{"id":"e04","fromNode":"delight","fromSide":"right","toNode":"height","toSide":"left"},{"id":"e05","fromNode":"mask","fromSide":"right","toNode":"map-check","toSide":"left"},{"id":"e06","fromNode":"height","fromSide":"right","toNode":"map-check","toSide":"left"},{"id":"e07","fromNode":"map-check","fromSide":"bottom","toNode":"highpoly","toSide":"top","label":"认可地图","routeY":432},{"id":"e08","fromNode":"highpoly","fromSide":"right","toNode":"walls","toSide":"left"},{"id":"e09","fromNode":"walls","fromSide":"right","toNode":"uv","toSide":"left"},{"id":"e10","fromNode":"uv","fromSide":"right","toNode":"relief","toSide":"left"},{"id":"e11","fromNode":"relief","fromSide":"right","toNode":"geometry-check","toSide":"left"},{"id":"e12","fromNode":"geometry-check","fromSide":"bottom","toNode":"export","toSide":"top","label":"认可 UV 高模","routeY":732},{"id":"e13","fromNode":"export","fromSide":"right","toNode":"roundtrip","toSide":"left"},{"id":"e14","fromNode":"roundtrip","fromSide":"right","toNode":"blender","toSide":"left"},{"id":"e15","fromNode":"blender","fromSide":"right","toNode":"wear","toSide":"left","label":"按需","optional":true},{"id":"e16","fromNode":"wear","fromSide":"right","toNode":"wear-check","toSide":"left","optional":true},{"id":"e17","fromNode":"mask","fromSide":"bottom","toNode":"height","toSide":"top","label":"共享布局"}],"revision":"1.0.0"}</script>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
const source=JSON.parse($('workflow-data').textContent),initial=structuredClone(source);
const categories={image:'图像参考',map:'材料 / 深度',mesh:'几何制作',check:'质量核对',delivery:'文件交付',optional:'可选分支',future:'扩展路线',note:'注释'};
let model=structuredClone(source),selected='height',showFuture=false,view={x:0,y:0,z:1},drag=null,toastTimer=null;
const storageKey='ornament-workflow-canvas-'+(source.revision||'legacy');
try{const saved=JSON.parse(localStorage.getItem(storageKey)||'null');if(saved?.canvas){model=parseCanvas(saved.canvas);if(!model.nodes.some(n=>n.id===selected))selected=model.nodes[0].id;}}catch(e){}
const visible=n=>showFuture||n.scope!=='future';
const visibleNodes=()=>model.nodes.filter(visible);
const selectedNode=()=>model.nodes.find(n=>n.id===selected);
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;}
function svg(tag,attrs={}){const e=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,String(v));return e;}
function notify(text){clearTimeout(toastTimer);$('toast').textContent=text;$('toast').style.display='block';toastTimer=setTimeout(()=>$('toast').style.display='none',2600);}
function save(){try{localStorage.setItem(storageKey,JSON.stringify({canvas:exportData()}));}catch(e){notify('浏览器未允许保存；可以导出画布保留修改');}}
function bounds(){const ns=visibleNodes();if(!ns.length)return{x:0,y:0,w:500,h:400};return{x:Math.min(...ns.map(n=>n.x))-38,y:Math.min(...ns.map(n=>n.y))-58,w:Math.max(...ns.map(n=>n.x+n.width))-Math.min(...ns.map(n=>n.x))+76,h:Math.max(...ns.map(n=>n.y+n.height))-Math.min(...ns.map(n=>n.y))+96};}
function transform(){ $('world').style.transform=`translate(${view.x}px,${view.y}px) scale(${view.z})`;$('zoom').textContent=Math.round(view.z*100)+'%';$('viewport').style.backgroundSize=(24*view.z)+'px '+(24*view.z)+'px';$('viewport').style.backgroundPosition=view.x+'px '+view.y+'px';drawMini();}
function fit(){const b=bounds(),r=$('viewport').getBoundingClientRect();view.z=Math.min(1,(r.width-36)/b.w,(r.height-32)/b.h);view.z=Math.max(.2,view.z);view.x=(r.width-b.w*view.z)/2-b.x*view.z;view.y=(r.height-b.h*view.z)/2-b.y*view.z;transform();}
function zoomAt(factor,cx,cy){const z=Math.min(2.4,Math.max(.2,view.z*factor)),ratio=z/view.z;view.x=cx-(cx-view.x)*ratio;view.y=cy-(cy-view.y)*ratio;view.z=z;transform();}
function focus(){const n=selectedNode();if(!n||!visible(n))return;const r=$('viewport').getBoundingClientRect();view.z=Math.min(1.1,(r.width-50)/(n.width+100));view.x=r.width/2-(n.x+n.width/2)*view.z;view.y=r.height/2-(n.y+n.height/2)*view.z;transform();}
function position(n,side){if(side==='left')return[n.x,n.y+n.height/2];if(side==='top')return[n.x+n.width/2,n.y];if(side==='bottom')return[n.x+n.width/2,n.y+n.height];return[n.x+n.width,n.y+n.height/2];}
function pathFor(edge){const a=model.nodes.find(n=>n.id===edge.fromNode),b=model.nodes.find(n=>n.id===edge.toNode);if(!a||!b||!visible(a)||!visible(b))return null;const p=position(a,edge.fromSide||'right'),q=position(b,edge.toSide||'left');let d,label;
if(Number.isFinite(edge.routeY)&&edge.fromSide==='bottom'&&edge.toSide==='top'){const y=Math.max(p[1]+24,Math.min(q[1]-24,edge.routeY)),r=12,s=q[0]>=p[0]?1:-1;d=`M ${p[0]} ${p[1]} L ${p[0]} ${y-r} Q ${p[0]} ${y} ${p[0]+s*r} ${y} L ${q[0]-s*r} ${y} Q ${q[0]} ${y} ${q[0]} ${y+r} L ${q[0]} ${q[1]}`;label=[(p[0]+q[0])/2,y-8];}
else{const h=Math.max(30,Math.abs(q[0]-p[0])*.48),from=edge.fromSide||'right',to=edge.toSide||'left';const vec=s=>s==='left'?[-1,0]:s==='top'?[0,-1]:s==='bottom'?[0,1]:[1,0],v1=vec(from),v2=vec(to);d=`M ${p[0]} ${p[1]} C ${p[0]+v1[0]*h} ${p[1]+v1[1]*h}, ${q[0]+v2[0]*h} ${q[1]+v2[1]*h}, ${q[0]} ${q[1]}`;label=[(p[0]+q[0])/2,(p[1]+q[1])/2-10];}return{d,label};}
function drawEdges(){const g=$('edge-paths');g.replaceChildren();for(const e of model.edges){const p=pathFor(e);if(!p)continue;const line=svg('path',{d:p.d,class:'edge'+(e.optional?' optional':'')+([e.fromNode,e.toNode].includes(selected)?' selected':''),'marker-end':'url(#arrow)'});g.append(line);if(e.label){const label=svg('text',{x:p.label[0],y:p.label[1],'text-anchor':'middle',class:'edge-label'});label.textContent=e.label;g.append(label);}}}
function drawGroups(){const layer=$('groups');layer.replaceChildren();for(const g of model.groups||[]){if(!visible(g))continue;const box=el('div',undefined,'group');box.dataset.scope=g.scope||'main';Object.assign(box.style,{left:g.x+'px',top:g.y+'px',width:g.width+'px',height:g.height+'px'});box.append(el('label',g.label));layer.append(box);}}
function drawNodes(){const layer=$('nodes');layer.replaceChildren();visibleNodes().forEach((n,index)=>{const card=el('div',undefined,'node'+(n.id===selected?' selected':''));card.dataset.id=n.id;card.dataset.category=n.category||'note';card.tabIndex=0;card.setAttribute('role','button');card.setAttribute('aria-label',n.title+'，'+n.status+'，按回车查看');Object.assign(card.style,{left:n.x+'px',top:n.y+'px',width:n.width+'px',height:n.height+'px'});const top=el('div',undefined,'node-top');top.append(el('span',String(index+1).padStart(2,'0')+' · '+(categories[n.category]||'注释')),el('span',n.status||'注释'));const title=el('div',n.title,'node-title');title.title=n.title;const summary=el('div',n.summary,'node-summary');summary.title=n.summary;const ports=el('div',undefined,'ports');ports.append(el('span',n.id==='photo'?'输入参考':'输入'),el('span',n.id==='wear-check'?'复验输出':'输出'));card.append(top,title,summary,ports);card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(n.id);}});layer.append(card);});$('counts').textContent=`${visibleNodes().length} 个节点 · ${model.edges.filter(e=>visible(model.nodes.find(n=>n.id===e.fromNode)||{})&&visible(model.nodes.find(n=>n.id===e.toNode)||{})).length} 条连接 · `+initial.accepted_state;}
function drawMini(){const b=bounds(),s=$('mini-svg');s.setAttribute('viewBox',`${b.x} ${b.y} ${b.w} ${b.h}`);s.replaceChildren();for(const n of visibleNodes())s.append(svg('rect',{x:n.x,y:n.y,width:n.width,height:n.height,rx:6,class:'mini-node'}));const r=$('viewport').getBoundingClientRect();s.append(svg('rect',{x:-view.x/view.z,y:-view.y/view.z,width:r.width/view.z,height:r.height/view.z,class:'mini-rect'}));}
function assetURL(path){if(typeof path!=='string'||path.includes('..')||path.startsWith('/')||/^[a-z]+:/i.test(path))return null;return'../'+path;}
function renderDetails(){const n=selectedNode(),d=$('details');d.replaceChildren();if(!n){d.append(el('p','请选择节点'));return;}const head=el('div',undefined,'panel-header');head.append(el('span',categories[n.category]||'注释','panel-overline'),el('span',n.status||'注释','panel-status'));d.append(head,el('h2',n.title),el('p',n.summary,'panel-summary'));const io=el('dl',undefined,'io');io.append(el('dt','输入'),el('dd',n.input||'—'),el('dt','输出'),el('dd',n.output||'—'));d.append(io);
if(n.rules&&n.rules.length){d.append(el('h3','结构约束'));const list=el('ul',undefined,'rules');n.rules.forEach(r=>list.append(el('li',r)));d.append(list);}if(n.params&&n.params.length){d.append(el('h3','已验案例参数'));const params=el('div',undefined,'params');n.params.forEach(p=>params.append(el('span',p[0]),el('span',p[1])));d.append(params);}
if(n.command){d.append(el('h3','执行命令'));const code=el('pre',n.command,'command');d.append(code);const copy=el('button','复制命令','copy');copy.type='button';copy.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(n.command);notify('命令已复制；请在项目执行环境运行');}catch(e){const range=document.createRange();range.selectNodeContents(code);const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);notify('已选中命令，请按 Ctrl / Cmd + C');}});d.append(copy);}
if(n.assets&&n.assets.length){d.append(el('h3','关联文件'));for(const[name,path]of n.assets){const url=assetURL(path);if(!url)continue;const a=el('a',name+' ↗','asset');a.href=url;a.target='_blank';a.rel='noopener';d.append(a);}}
if(n.preview&&assetURL(n.preview)){const image=el('img',undefined,'preview');image.src=assetURL(n.preview);image.alt=n.title+' 的认可参考';image.loading='lazy';image.addEventListener('error',()=>image.remove());d.append(image);} $('note').value=n.note||'';}
function select(id){selected=id;document.querySelectorAll('.node').forEach(n=>n.classList.toggle('selected',n.dataset.id===id));drawEdges();renderDetails();}
function render(){drawGroups();drawNodes();drawEdges();renderDetails();transform();}
$('note').addEventListener('input',()=>{const n=selectedNode();if(n){n.note=$('note').value.slice(0,8000);save();}});
$('viewport').addEventListener('wheel',e=>{e.preventDefault();const r=$('viewport').getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*.001),e.clientX-r.left,e.clientY-r.top);},{passive:false});
$('viewport').addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('#minimap'))return;const card=e.target.closest('.node');if(card){const n=model.nodes.find(n=>n.id===card.dataset.id);select(n.id);drag={type:'node',id:n.id,startX:e.clientX,startY:e.clientY,x:n.x,y:n.y};card.classList.add('dragging');}else{drag={type:'pan',startX:e.clientX,startY:e.clientY,x:view.x,y:view.y};$('viewport').classList.add('panning');}$('viewport').setPointerCapture(e.pointerId);});
$('viewport').addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.startX,dy=e.clientY-drag.startY;if(drag.type==='pan'){view.x=drag.x+dx;view.y=drag.y+dy;transform();}else{const n=model.nodes.find(n=>n.id===drag.id);n.x=Math.round(drag.x+dx/view.z);n.y=Math.round(drag.y+dy/view.z);const card=document.querySelector(`.node[data-id="${CSS.escape(n.id)}"]`);card.style.left=n.x+'px';card.style.top=n.y+'px';drawEdges();drawMini();}});
function endDrag(){if(drag&&drag.type==='node')save();drag=null;$('viewport').classList.remove('panning');document.querySelectorAll('.dragging').forEach(n=>n.classList.remove('dragging'));}
$('viewport').addEventListener('pointerup',endDrag);$('viewport').addEventListener('pointercancel',endDrag);
$('zoom-in').addEventListener('click',()=>{const r=$('viewport').getBoundingClientRect();zoomAt(1.2,r.width/2,r.height/2);});$('zoom-out').addEventListener('click',()=>{const r=$('viewport').getBoundingClientRect();zoomAt(1/1.2,r.width/2,r.height/2);});$('fit').addEventListener('click',fit);$('focus').addEventListener('click',focus);
$('future').addEventListener('click',()=>{showFuture=!showFuture;$('future').setAttribute('aria-pressed',String(showFuture));$('future').classList.toggle('active',showFuture);if(!showFuture&&selectedNode()?.scope==='future')selected='height';render();fit();});
$('default-layout').addEventListener('click',()=>{for(const n of model.nodes){const original=initial.nodes.find(o=>o.id===n.id);if(original){n.x=original.x;n.y=original.y;}}save();render();fit();notify('已恢复内置节点位置；注释保留');});
$('panel-toggle').addEventListener('click',()=>{const open=document.body.classList.toggle('show-panel');$('panel-toggle').setAttribute('aria-expanded',String(open));});
$('minimap').addEventListener('pointerdown',e=>{e.stopPropagation();const b=bounds(),r=$('mini-svg').getBoundingClientRect(),scale=Math.min(r.width/b.w,r.height/b.h),ox=(r.width-b.w*scale)/2,oy=(r.height-b.h*scale)/2,x=b.x+(e.clientX-r.left-ox)/scale,y=b.y+(e.clientY-r.top-oy)/scale,vr=$('viewport').getBoundingClientRect();view.x=vr.width/2-x*view.z;view.y=vr.height/2-y*view.z;transform();});
function canvasText(n){let text=`## ${n.title}\n\n${n.summary}\n\n**状态：${n.status||'注释'}**\n\n输入：${n.input||'—'}\n\n输出：${n.output||'—'}`;if(n.rules?.length)text+='\n\n'+n.rules.map(r=>'- '+r).join('\n');if(n.params?.length)text+='\n\n'+n.params.map(p=>`${p[0]}：${p[1]}`).join('\n\n');if(n.command)text+='\n\n```sh\n'+n.command+'\n```';if(n.note)text+='\n\n<!-- ornament-note -->\n'+n.note;return text;}
function exportData(){return{nodes:[...(model.groups||[]).map(g=>({id:g.id,type:'group',x:Math.round(g.x),y:Math.round(g.y),width:g.width,height:g.height,label:g.label})),...model.nodes.map(n=>({id:n.id,type:'text',x:Math.round(n.x),y:Math.round(n.y),width:n.width,height:n.height,text:canvasText(n),color:n.category==='optional'?'2':n.category==='future'?'6':n.category==='image'||n.category==='map'?'5':'4'}))],edges:model.edges.map(e=>({id:e.id,fromNode:e.fromNode,fromSide:e.fromSide||'right',toNode:e.toNode,toSide:e.toSide||'left',toEnd:'arrow',...(e.label?{label:e.label}:{})}))};}
$('export-canvas').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(exportData(),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=el('a');link.href=url;link.download='photo-to-ornament.canvas';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);notify('画布已导出；模型参数与文件未改变');});
$('import').addEventListener('click',()=>$('import-file').click());
function parseCanvas(data){if(!Array.isArray(data.nodes)||!Array.isArray(data.edges)||data.nodes.length>200||data.edges.length>500)throw Error('需要有效 JSON Canvas nodes / edges');const ids=new Set();const imported=[],groups=[];for(const n of data.nodes){if(typeof n.id!=='string'||ids.has(n.id)||![n.x,n.y,n.width,n.height].every(Number.isFinite)||n.width<=0||n.height<=0||Math.max(Math.abs(n.x),Math.abs(n.y),n.width,n.height)>100000)throw Error('节点 ID、尺寸或位置无效');ids.add(n.id);if(n.type==='group'){groups.push({id:n.id,label:typeof n.label==='string'?n.label:'分组',x:n.x,y:n.y,width:n.width,height:n.height,scope:initial.groups.find(g=>g.id===n.id)?.scope});continue;}if(n.type!=='text'||typeof n.text!=='string')throw Error('当前查看器支持文本与分组节点');const known=initial.nodes.find(o=>o.id===n.id);const node=known?structuredClone(known):{id:n.id,title:n.text.split('\n')[0].replace(/^#+\s*/,''),summary:n.text.slice(0,500),category:'note',status:'导入注释',input:'—',output:'—',rules:[]};Object.assign(node,{x:n.x,y:n.y,width:n.width,height:n.height});const marker='<!-- ornament-note -->';if(n.text.includes(marker))node.note=n.text.split(marker).slice(1).join(marker).trim();imported.push(node);}if(!imported.length)throw Error('画布没有文本节点');const nodeIDs=new Set(imported.map(n=>n.id)),edgeIDs=new Set();const edges=data.edges.map(e=>{if(typeof e.id!=='string'||edgeIDs.has(e.id)||!nodeIDs.has(e.fromNode)||!nodeIDs.has(e.toNode)||!['left','right','top','bottom',undefined].includes(e.fromSide)||!['left','right','top','bottom',undefined].includes(e.toSide))throw Error('连接引用无效');edgeIDs.add(e.id);const known=initial.edges.find(k=>k.id===e.id);return{id:e.id,fromNode:e.fromNode,toNode:e.toNode,fromSide:e.fromSide||'right',toSide:e.toSide||'left',label:typeof e.label==='string'?e.label:'',optional:known?.optional,routeY:known?.routeY};});return{...structuredClone(initial),nodes:imported,groups,edges};}
$('import-file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>2*1024*1024)throw Error('画布文件不能超过 2 MB');model=parseCanvas(JSON.parse(await file.text()));selected=model.nodes[0].id;save();render();fit();notify('已导入布局与注释；内置制作约束保持原定义');}catch(error){notify('导入失败：'+error.message);}e.target.value='';});
new ResizeObserver(()=>fit()).observe($('viewport'));
render();requestAnimationFrame(fit);
})();
</script>
</body>
